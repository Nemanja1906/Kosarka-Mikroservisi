services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  eureka-server:
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"

  product-service:
    build:
      context: ./product-service/product-service
      dockerfile: Dockerfile
    depends_on:
      - eureka-server

  inventory-service:
    build:
      context: ./inventory-service/inventory-service
      dockerfile: Dockerfile
    depends_on:
      - eureka-server

  order-service:
    build:
      context: ./order-service/order-service
      dockerfile: Dockerfile
    depends_on:
      - eureka-server
      - rabbitmq